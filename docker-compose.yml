version: "3.9"

services:

  db:
    image: postgres:18.4-alpine
    restart: always
    environment:
      POSTGRES_DB: meeting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: runner
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    restart: "no"

  api:
    build:
      context: .
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    ports:
      - "8000:8000"
